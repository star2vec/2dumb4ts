extends: base.yaml

# Gated repo on HuggingFace; requires an accepted licence and a token in the
# environment. Not present in the dev cache -- fetch on the run machine.
model:
  name: llama-3.2-3b-instruct
  hf_id: meta-llama/Llama-3.2-3B-Instruct
  revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
  dtype: bfloat16
  device: auto

# 8 GB VRAM on the run machine (RTX 2000 Ada Generation Laptop GPU, not the 16 GB
# workstation card). A 3B model in bf16 is ~6.4 GB of weights, so headroom is thin;
# halving the batch keeps activations comfortably clear. batch_size is part of the
# pass_a cache key, so it is set before any run rather than adjusted after one.
batch_size: 16
