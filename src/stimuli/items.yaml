# Stage 0 item pool: 400 items, 100 per domain, 4 neutral domains.
#
# HARD REQUIREMENT: no factual claim, verifiable property, or correctness-bearing
# statement appears anywhere in this file. Items are bare names and noun phrases;
# all framing is supplied by templates.yaml and is purely about personal appeal.
# Stage 0 must not contain material that could engage truth-tracking, because the
# project's later claims depend on the two paradigms being non-overlapping.
#
# Item ids are derived from the domain and a slug of the label, so reordering this
# file does not renumber items and does not change any random-effect grouping key.
# Uniqueness is asserted at load time.

